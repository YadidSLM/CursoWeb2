<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./statics/style/index.css">
</head>
<body>
    <div id="title"></div>
    <div id="buscador">
        <input type="text" name="pokemon" placeholder="Pokemón" id="input">
        <button type="button" id="agregar">+</button>
    </div>
    <div id="form">
        <h2>Agregar pokemón</h2>
        <label for="nombre">Nombre: </label>
        <input type="text" name="nombre" id="nombre"> <br><br>
        <label for="altura">Altura: </label>
        <input type="number" name="altura" id="altura" min="1"><br><br>
        <label for="peso">Peso: </label>
        <input type="number" name="peso" id="peso" min="1"><br><br>
        <label for="experiencia">Experiencia base: </label>
        <input type="number" name="experiencia" id="experiencia" min="1"><br><br>
        <label for="tipo">Tipo</label>
        <select name="tipo" id="select-tipos"></select><br><br>
        
        <button type="submit" id="enviar">Agregar</button>
    </div>
    <script src="./dynamics/js/index.js"></script> <!-- Mejor ponerlo aquí para que termine de cargar el html y luego obtenga los elementos en el JavaScript -->
</body>
</html>
